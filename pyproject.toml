[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-sympy"
version = "0.1.0"
description = "Exact polynomial and matrix kernels in Mojo with a SymPy-compatible Python API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy", "sympy"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
